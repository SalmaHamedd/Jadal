name: jadal_app
description: "A new Flutter project."

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  get_it: ^9.2.1
  fpdart: ^1.2.0
  bloc: ^9.2.1
  equatable: ^2.0.8
  flutter_bloc: ^9.1.1
  google_fonts: ^6.2.1
  app_links: 7.0.0
  image_picker: ^1.2.2
  fluttertoast: ^8.2.8
  livekit_client: ^2.1.0
  flutter_webrtc: ^0.12.0
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.9.0
  encrypt: ^5.0.1
  internet_connection_checker: ^1.0.0+1
  permission_handler: ^12.0.0+1
  cached_network_image: ^3.3.1
  conditional_builder_null_safety: ^0.0.6
  fl_chart: ^0.69.0
  # Lightweight audio playback for the debate protected-period bell (§8.3).
  audioplayers: ^6.1.0
  # Export the debater-statistics analysis as a styled .xlsx sheet + share it.
  excel: ^4.0.6
  share_plus: ^10.1.4
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.3.0
  # MF_FU §1.2 — the drawer's about-us rows deep-link out (tel:, mailto:,
  # instagram://, wa.me), so each contact value opens the right app.
  url_launcher: ^6.3.1

# url_launcher_android 6.3.30 pulls androidx.browser:browser:1.9.0, which does
# not resolve from the repos the Android build is configured with (google(),
# mavenCentral(), the Flutter storage mirror, jitpack) — the build fails at
# :app:checkDebugAarMetadata with "Could not find androidx.browser:browser:1.9.0".
# 6.3.14 is the last line that depends on androidx.browser 1.8.0, which is
# present in google(). Nothing in the app uses an API newer than that.
# Remove this override once browser 1.9.0 is actually published to Google Maven.
dependency_overrides:
  url_launcher_android: 6.3.14

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  # Plain (non-adaptive) icon: the source is a flattened image with the logo's
  # own cream backdrop baked in, not padded transparent artwork, so it isn't
  # safe to feed as an adaptive-icon foreground layer (Android's mask shapes —
  # circle/squircle/etc. — would clip the head shapes near the edges).
  image_path: "assets/images/Jadal-logo.jpg"

flutter:
  generate: true

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    # Drop a `bell.mp3` here for the debate protected-period bell (§8.3).
    - assets/sounds/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
